name: Keep Render awake

# Three trigger layers, in order of reliability:
#  - workflow_run: this workflow re-triggers itself ~4.5 min after each run
#    completes (the sleep below), giving a steady heartbeat independent of
#    the Actions cron scheduler (which has been lagging hours on this account).
#  - schedule: bonus pings if/when GitHub's cron scheduler behaves.
#  - workflow_dispatch: manual tests.
on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Keep Render awake]
    types: [completed]

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake Render
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 \
              'https://nuvio-moviebox.onrender.com/manifest.json' || echo 000)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 30
          done
          exit 1
      - name: Wait before next cycle
        run: sleep 240
