name: Heartbeat A

# Half of a mutual-retriggering ping chain (GitHub forbids a workflow
# listening to itself, but A <-> B cross-triggers are allowed). Each run
# pings Render, then sleeps ~4 min before completing — which immediately
# fires Heartbeat B, and so on, forever, with no dependence on the Actions
# cron scheduler (which has been lagging hours on this account).
on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Heartbeat B]
    types: [completed]

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake Render
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 \
              'https://nuvio-moviebox.onrender.com/manifest.json' || echo 000)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 30
          done
          exit 1
      - name: Wait before handing off to Heartbeat B
        run: sleep 240
